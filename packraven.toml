allowed_override_jars = []
exclude = []

[modrinth]
project_id = ""
allowed_override_jars = []
exclude = []
allowed_authors = []

[export]
exclude = [
    ".githooks/**",
    ".gitignore",
    ".gitattributes",
    "mods.lock.json",
    "packraven.toml",
    "changelog.md",
    "changelogs/**",
    "README*",
]
recommended_ram_mb = 8000

[export.properties]

[server]
exclude = [
    "resourcepacks/**",
    "shaderpacks/**",
    "options.txt",
    "config/fancymenu/**",
    "config/drippyloadingscreen/**",
]
client_only = []
keep = []
